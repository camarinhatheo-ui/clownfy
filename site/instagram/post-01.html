<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post 01 · O coringa do seu Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rye&family=DM+Serif+Display&family=Manrope:wght@500;700;800&display=block" rel="stylesheet">
<style>
/* Post de feed 1080x1350 (4:5). Mesma paleta e fontes do site, sem nenhuma imagem do site: tudo desenhado aqui. */
:root{
  --bg:#090203; --ink:#FFF4EC; --muted:#C9AFA8;
  --red:#FF1E2D; --red-2:#C40A18; --red-deep:#7A0410;
  --gold:#F6C452; --gold-hi:#FFF0B3; --gold-lo:#B07A16;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
body{font-family:"Manrope",sans-serif;color:var(--ink)}

.post{position:relative;width:1080px;height:1350px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 62% 40% at 50% 66%,rgba(255,30,45,.40),transparent 70%),
    radial-gradient(ellipse 60% 26% at 50% 8%,rgba(255,30,45,.22),transparent 75%),
    radial-gradient(ellipse 50% 22% at 50% 100%,rgba(246,196,82,.10),transparent 70%),
    var(--bg)}

/* holofote */
.beam{position:absolute;left:50%;top:60px;width:1100px;height:1200px;transform:translateX(-50%);z-index:-1;filter:blur(8px);
  background:conic-gradient(from 180deg at 50% 0%,transparent 158deg,rgba(255,230,210,.06) 170deg,rgba(255,230,210,.10) 180deg,rgba(255,230,210,.06) 190deg,transparent 202deg)}

/* lona de circo no topo */
.valance{position:absolute;top:0;left:0;width:1080px;height:140px;z-index:4;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}

/* confete */
.cf{position:absolute;z-index:1;border-radius:2px}

/* título */
.top{position:absolute;top:178px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:3;text-align:center}
.eyebrow{font-family:"Rye";font-size:36px;color:var(--gold);letter-spacing:.04em;text-shadow:0 0 18px rgba(246,196,82,.35)}
h1{font-family:"Anton";font-weight:400;text-transform:uppercase;line-height:1;font-size:116px;letter-spacing:.005em}
h1 .l1{display:block;text-shadow:0 0 18px rgba(255,30,45,.55),0 0 48px rgba(255,30,45,.35)}
h1 .l2{display:block;padding-top:.06em;
  background:linear-gradient(180deg,#FF8A8A 0%,var(--red) 35%,var(--red-2) 70%,var(--red-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,30,45,.6))}

/* leque de cartas: cada carta é um serviço */
.fan{position:absolute;left:0;right:0;top:560px;height:520px;z-index:2}
.card{position:absolute;left:calc(50% - 95px);top:84px;width:190px;height:266px;border-radius:18px;
  transform-origin:50% 230%;
  background:linear-gradient(150deg,#FFF6D6 0%,#F9DE97 30%,var(--gold) 55%,#D99A28 80%,var(--gold-lo) 100%);
  box-shadow:0 0 0 2px #7A4F08 inset,0 0 0 8px rgba(255,255,255,.2) inset,0 22px 40px rgba(0,0,0,.6),0 0 36px rgba(246,196,82,.22);
  color:#2A0805;font-family:"DM Serif Display";display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.card::before{content:"";position:absolute;inset:13px;border:2px solid rgba(122,79,8,.5);border-radius:10px}
.card.red{color:var(--red-deep)}
.card .rk{position:absolute;font-size:38px;line-height:.9;text-align:center}
.card .rk span{display:block;font-size:28px}
.card .tl{top:22px;left:22px}.card .br{bottom:22px;right:22px;transform:rotate(180deg)}
.card .mid{font-size:84px;line-height:.9;margin-top:-6px}
.card .lbl{font-family:"Manrope";font-weight:800;font-size:19px;letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.15;color:#2A0805}
.card.k1{transform:rotate(-44deg)}
.card.k2{transform:rotate(-23deg)}
.card.k4{transform:rotate(23deg)}
.card.k5{transform:rotate(44deg)}

/* coringa central */
.card.joker{left:calc(50% - 124px);top:10px;width:248px;height:347px;z-index:5;transform:rotate(0deg);
  background:linear-gradient(160deg,#1B0407 0%,#2E070C 55%,#140205 100%);
  box-shadow:0 0 0 3px var(--gold) inset,0 0 0 10px rgba(246,196,82,.12) inset,0 26px 50px rgba(0,0,0,.7),0 0 70px rgba(255,30,45,.55)}
.card.joker::before{border-color:rgba(246,196,82,.45)}
.joker .rk{font-family:"Anton";font-size:25px;line-height:1.02;color:var(--gold)}
.joker .tl{top:24px;left:24px}.joker .br{bottom:24px;right:24px}
.joker svg{width:176px;margin-top:-4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}

/* rodapé */
.bottom{position:absolute;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:26px;z-index:4;text-align:center}
.tag{font-size:32px;font-weight:700;color:var(--ink)}
.tag b{color:var(--gold);font-weight:800}
.sign{display:flex;align-items:center;gap:22px}
.word{font-family:"Anton";font-size:46px;letter-spacing:.04em;line-height:1}
.word span{color:var(--red);text-shadow:0 0 16px rgba(255,30,45,.6)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.handle{display:inline-flex;align-items:center;padding:12px 28px;border-radius:999px;
  background:linear-gradient(180deg,var(--red) 0%,var(--red-2) 100%);font-weight:800;font-size:27px;
  box-shadow:0 0 0 2px rgba(255,255,255,.12) inset,0 0 30px rgba(255,30,45,.5)}
</style>
</head>
<body>
<div class="post">
  <div class="beam"></div>

  <!-- lona listrada com bordas recortadas e lâmpadas -->
  <svg class="valance" viewBox="0 0 1080 140" aria-hidden="true">
    <defs>
      <pattern id="stripes" width="180" height="140" patternUnits="userSpaceOnUse">
        <rect width="90" height="140" fill="#C40A18"/><rect x="90" width="90" height="140" fill="#F3E4CC"/>
      </pattern>
      <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
      </linearGradient>
      <radialGradient id="bulb"><stop offset="0" stop-color="#FFFBE6"/><stop offset=".45" stop-color="#FFD866"/><stop offset="1" stop-color="#F6C452" stop-opacity="0"/></radialGradient>
      <path id="scallop" d="M0,0 H1080 V78 Q1035,124 990,78 Q945,124 900,78 Q855,124 810,78 Q765,124 720,78 Q675,124 630,78 Q585,124 540,78 Q495,124 450,78 Q405,124 360,78 Q315,124 270,78 Q225,124 180,78 Q135,124 90,78 Q45,124 0,78 Z"/>
    </defs>
    <use href="#scallop" fill="url(#stripes)"/>
    <use href="#scallop" fill="url(#shade)"/>
    <path d="M0,78 Q45,124 90,78 Q135,124 180,78 Q225,124 270,78 Q315,124 360,78 Q405,124 450,78 Q495,124 540,78 Q585,124 630,78 Q675,124 720,78 Q765,124 810,78 Q855,124 900,78 Q945,124 990,78 Q1035,124 1080,78" fill="none" stroke="#F6C452" stroke-width="5"/>
    <g fill="url(#bulb)">
      <circle cx="45" cy="101" r="15"/><circle cx="135" cy="101" r="15"/><circle cx="225" cy="101" r="15"/><circle cx="315" cy="101" r="15"/>
      <circle cx="405" cy="101" r="15"/><circle cx="495" cy="101" r="15"/><circle cx="585" cy="101" r="15"/><circle cx="675" cy="101" r="15"/>
      <circle cx="765" cy="101" r="15"/><circle cx="855" cy="101" r="15"/><circle cx="945" cy="101" r="15"/><circle cx="1035" cy="101" r="15"/>
    </g>
  </svg>

  <!-- confete -->
  <i class="cf" style="left:92px;top:520px;width:14px;height:24px;background:#F6C452;transform:rotate(24deg)"></i>
  <i class="cf" style="left:160px;top:640px;width:12px;height:12px;background:#FF1E2D;transform:rotate(45deg)"></i>
  <i class="cf" style="left:58px;top:760px;width:10px;height:20px;background:#FFF0B3;transform:rotate(-30deg);opacity:.8"></i>
  <i class="cf" style="left:120px;top:935px;width:14px;height:14px;background:#F6C452;transform:rotate(45deg)"></i>
  <i class="cf" style="left:70px;top:1060px;width:12px;height:22px;background:#FF1E2D;transform:rotate(60deg)"></i>
  <i class="cf" style="right:96px;top:500px;width:12px;height:22px;background:#FF1E2D;transform:rotate(-20deg)"></i>
  <i class="cf" style="right:150px;top:620px;width:14px;height:14px;background:#F6C452;transform:rotate(45deg)"></i>
  <i class="cf" style="right:60px;top:740px;width:10px;height:20px;background:#F6C452;transform:rotate(35deg)"></i>
  <i class="cf" style="right:118px;top:900px;width:12px;height:12px;background:#FFF0B3;transform:rotate(45deg);opacity:.8"></i>
  <i class="cf" style="right:66px;top:1040px;width:14px;height:24px;background:#F6C452;transform:rotate(-55deg)"></i>
  <i class="cf" style="left:250px;top:150px;width:10px;height:18px;background:#F6C452;transform:rotate(30deg);opacity:.7"></i>
  <i class="cf" style="right:240px;top:160px;width:12px;height:12px;background:#FF1E2D;transform:rotate(45deg);opacity:.8"></i>

  <div class="top">
    <p class="eyebrow">Respeitável público</p>
    <h1><span class="l1">O coringa</span><span class="l2">do seu Instagram.</span></h1>
  </div>

  <div class="fan">
    <div class="card red k1"><span class="rk tl">A<span>♥</span></span><span class="mid">♥</span><span class="lbl">Posts</span><span class="rk br">A<span>♥</span></span></div>
    <div class="card k2"><span class="rk tl">K<span>♠</span></span><span class="mid">♠</span><span class="lbl">Stories</span><span class="rk br">K<span>♠</span></span></div>
    <div class="card red k4"><span class="rk tl">Q<span>♦</span></span><span class="mid">♦</span><span class="lbl">Site</span><span class="rk br">Q<span>♦</span></span></div>
    <div class="card k5"><span class="rk tl">J<span>♣</span></span><span class="mid">♣</span><span class="lbl">Identidade<br>visual</span><span class="rk br">J<span>♣</span></span></div>

    <div class="card joker">
      <span class="rk tl">J<br>O<br>K<br>E<br>R</span>
      <!-- bobo da corte desenhado para o post -->
      <svg viewBox="0 0 200 220" aria-hidden="true">
        <defs>
          <linearGradient id="hR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A64"/><stop offset=".5" stop-color="#E0101E"/><stop offset="1" stop-color="#7A0410"/></linearGradient>
          <linearGradient id="hG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0B3"/><stop offset=".5" stop-color="#F6C452"/><stop offset="1" stop-color="#9C6A10"/></linearGradient>
          <radialGradient id="face" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#FFFDF8"/><stop offset=".7" stop-color="#F3E4CC"/><stop offset="1" stop-color="#C9AE8C"/></radialGradient>
          <radialGradient id="ball" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#FFF8D6"/><stop offset=".4" stop-color="#F6C452"/><stop offset="1" stop-color="#8A5A08"/></radialGradient>
          <radialGradient id="nose" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#FF9AA0"/><stop offset=".4" stop-color="#FF1E2D"/><stop offset="1" stop-color="#7A0410"/></radialGradient>
        </defs>
        <!-- chapéu: três pontas -->
        <path d="M58,92 C40,70 22,58 8,64 C26,50 50,52 72,78 Z" fill="url(#hG)"/>
        <path d="M142,92 C160,70 178,58 192,64 C174,50 150,52 128,78 Z" fill="url(#hG)"/>
        <path d="M50,96 C44,62 20,34 6,40 C34,20 66,40 84,82 Z" fill="url(#hR)"/>
        <path d="M150,96 C156,62 180,34 194,40 C166,20 134,40 116,82 Z" fill="url(#hR)"/>
        <path d="M64,90 C70,50 88,20 100,8 C112,20 130,50 136,90 Z" fill="url(#hR)"/>
        <path d="M100,8 C94,30 92,60 96,90 L84,90 C82,58 90,26 100,8 Z" fill="#fff" opacity=".18"/>
        <circle cx="6" cy="40" r="10" fill="url(#ball)"/>
        <circle cx="194" cy="40" r="10" fill="url(#ball)"/>
        <circle cx="100" cy="8" r="9" fill="url(#ball)"/>
        <!-- faixa -->
        <path d="M44,88 Q100,74 156,88 L156,104 Q100,90 44,104 Z" fill="url(#hG)"/>
        <g fill="#7A0410"><path d="M70,93 l6,-6 l6,6 l-6,6Z"/><path d="M94,89 l6,-6 l6,6 l-6,6Z"/><path d="M118,93 l6,-6 l6,6 l-6,6Z"/></g>
        <!-- rosto -->
        <ellipse cx="100" cy="150" rx="54" ry="60" fill="url(#face)"/>
        <!-- olhos em losango -->
        <path d="M66,136 l12,-16 l12,16 l-12,16Z" fill="#1B0407"/>
        <path d="M110,136 l12,-16 l12,16 l-12,16Z" fill="#1B0407"/>
        <path d="M72,136 a6,4 0 1 0 12,0 a6,4 0 1 0 -12,0" fill="#FFF4EC"/>
        <path d="M116,136 a6,4 0 1 0 12,0 a6,4 0 1 0 -12,0" fill="#FFF4EC"/>
        <circle cx="78" cy="136" r="2.6" fill="#1B0407"/><circle cx="122" cy="136" r="2.6" fill="#1B0407"/>
        <!-- lágrima / losango na bochecha -->
        <path d="M128,160 l5,-8 l5,8 l-5,8Z" fill="#FF1E2D"/>
        <!-- nariz -->
        <circle cx="100" cy="158" r="12" fill="url(#nose)"/>
        <!-- sorriso -->
        <path d="M64,170 Q100,212 136,170 Q100,196 64,170Z" fill="#C40A18"/>
        <path d="M70,174 Q100,200 130,174" fill="none" stroke="#FFF4EC" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        <path d="M60,166 Q64,172 66,170" fill="none" stroke="#C40A18" stroke-width="4" stroke-linecap="round"/>
        <path d="M140,166 Q136,172 134,170" fill="none" stroke="#C40A18" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="rk br">J<br>O<br>K<br>E<br>R</span>
    </div>
  </div>

  <div class="bottom">
    <p class="tag">Social media e sites <b>pro seu negócio</b></p>
    <div class="sign"><span class="word">CLOWN<span>FY</span></span><i class="dot"></i><span class="handle">@agenciaclownfy</span></div>
  </div>
</div>
</body>
</html>
